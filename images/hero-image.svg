<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.25"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" opacity="0.08"/>
  <circle cx="256" cy="256" r="200" fill="url(#bg)" opacity="0.05"/>

  <!-- Neural network connections -->
  <g stroke="#6366f1" stroke-width="1.5" opacity="0.25">
    <!-- Layer 1 to Layer 2 -->
    <line x1="130" y1="120" x2="230" y2="180"/>
    <line x1="130" y1="120" x2="230" y2="256"/>
    <line x1="130" y1="120" x2="230" y2="332"/>
    <line x1="130" y1="200" x2="230" y2="180"/>
    <line x1="130" y1="200" x2="230" y2="256"/>
    <line x1="130" y1="200" x2="230" y2="332"/>
    <line x1="130" y1="312" x2="230" y2="180"/>
    <line x1="130" y1="312" x2="230" y2="256"/>
    <line x1="130" y1="312" x2="230" y2="332"/>
    <line x1="130" y1="392" x2="230" y2="180"/>
    <line x1="130" y1="392" x2="230" y2="256"/>
    <line x1="130" y1="392" x2="230" y2="332"/>
    <!-- Layer 2 to Layer 3 -->
    <line x1="230" y1="180" x2="340" y2="170"/>
    <line x1="230" y1="180" x2="340" y2="256"/>
    <line x1="230" y1="180" x2="340" y2="342"/>
    <line x1="230" y1="256" x2="340" y2="170"/>
    <line x1="230" y1="256" x2="340" y2="256"/>
    <line x1="230" y1="256" x2="340" y2="342"/>
    <line x1="230" y1="332" x2="340" y2="170"/>
    <line x1="230" y1="332" x2="340" y2="256"/>
    <line x1="230" y1="332" x2="340" y2="342"/>
    <!-- Layer 3 to output -->
    <line x1="340" y1="170" x2="410" y2="256"/>
    <line x1="340" y1="256" x2="410" y2="256"/>
    <line x1="340" y1="342" x2="410" y2="256"/>
  </g>

  <!-- Animated pulse connections -->
  <g stroke="#818cf8" stroke-width="2" opacity="0.5" filter="url(#glowFilter)">
    <line x1="130" y1="200" x2="230" y2="256"/>
    <line x1="230" y1="256" x2="340" y2="256"/>
    <line x1="340" y1="256" x2="410" y2="256"/>
  </g>

  <!-- Neural nodes - Layer 1 -->
  <g filter="url(#shadow)">
    <circle cx="130" cy="120" r="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <circle cx="130" cy="200" r="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <circle cx="130" cy="312" r="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <circle cx="130" cy="392" r="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  </g>

  <!-- Neural nodes - Layer 2 -->
  <g filter="url(#shadow)">
    <circle cx="230" cy="180" r="16" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="230" cy="256" r="18" fill="#818cf8" stroke="#4338ca" stroke-width="2.5"/>
    <circle cx="230" cy="332" r="16" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
  </g>

  <!-- Neural nodes - Layer 3 -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="170" r="16" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="340" cy="256" r="18" fill="#818cf8" stroke="#4338ca" stroke-width="2.5"/>
    <circle cx="340" cy="342" r="16" fill="#a5b4fc" stroke="#4f46e5" stroke-width="2"/>
  </g>

  <!-- Output node -->
  <g filter="url(#shadow)">
    <circle cx="410" cy="256" r="22" fill="#6366f1" stroke="#4338ca" stroke-width="3"/>
    <text x="410" y="262" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="white">AI</text>
  </g>

  <!-- Code bracket decoration - left -->
  <g opacity="0.15" fill="#4338ca">
    <text x="60" y="270" font-family="monospace" font-size="72" font-weight="bold">{</text>
  </g>

  <!-- Code bracket decoration - right -->
  <g opacity="0.15" fill="#4338ca">
    <text x="430" y="420" font-family="monospace" font-size="72" font-weight="bold">}</text>
  </g>

  <!-- Floating knowledge symbols -->
  <g font-family="system-ui" font-size="13" fill="#6366f1" opacity="0.4" font-weight="600">
    <text x="80" y="80">LLM</text>
    <text x="350" y="100">RAG</text>
    <text x="400" y="160">Agent</text>
    <text x="60" y="450">Prompt</text>
    <text x="370" y="440">TDD</text>
    <text x="180" y="460">MCP</text>
    <text x="80" y="180">SFT</text>
    <text x="400" y="380">SDD</text>
  </g>

  <!-- Central book/certificate icon -->
  <g transform="translate(240, 80)" filter="url(#shadow)">
    <!-- Book shape -->
    <rect x="0" y="0" width="48" height="36" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="24" y1="2" x2="24" y2="34" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="8" y1="10" x2="20" y2="10" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="8" y1="16" x2="20" y2="16" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="8" y1="22" x2="20" y2="22" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="28" y1="10" x2="40" y2="10" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="28" y1="16" x2="40" y2="16" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="28" y1="22" x2="40" y2="22" stroke="#a5b4fc" stroke-width="1"/>
    <!-- Checkmark -->
    <circle cx="36" cy="30" r="8" fill="#22c55e"/>
    <polyline points="32,30 35,33 40,27" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative dots pattern -->
  <g fill="#6366f1" opacity="0.08">
    <circle cx="450" cy="80" r="3"/>
    <circle cx="470" cy="80" r="3"/>
    <circle cx="490" cy="80" r="3"/>
    <circle cx="450" cy="100" r="3"/>
    <circle cx="470" cy="100" r="3"/>
    <circle cx="490" cy="100" r="3"/>
    <circle cx="20" cy="480" r="3"/>
    <circle cx="40" cy="480" r="3"/>
    <circle cx="60" cy="480" r="3"/>
    <circle cx="20" cy="500" r="3"/>
    <circle cx="40" cy="500" r="3"/>
    <circle cx="60" cy="500" r="3"/>
  </g>
</svg>